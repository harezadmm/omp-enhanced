name: Test Installation Script

on:
  push:
    branches: [ main ]
    paths:
      - 'install.sh'
      - '.github/workflows/test-installer.yml'
  pull_request:
    branches: [ main ]

jobs:
  test-installer:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [16.x, 18.x, 20.x]
    
    steps:
    - name: Checkout omp-enhanced
      uses: actions/checkout@v3
    
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}
    
    - name: Test installer syntax
      run: |
        bash -n install.sh
        echo "✅ Syntax check passed"
    
    - name: Verify skills directory
      run: |
        if [ -d "skills" ]; then
          SKILL_COUNT=$(find skills -name "SKILL.md" | wc -l)
          echo "Found $SKILL_COUNT skills"
          if [ "$SKILL_COUNT" -ge 100 ]; then
            echo "✅ Skills directory valid ($SKILL_COUNT skills)"
          else
            echo "⚠️ Only $SKILL_COUNT skills found (expected 126)"
          fi
        else
          echo "❌ Skills directory not found"
          exit 1
        fi
    
    - name: Verify documentation
      run: |
        REQUIRED_DOCS=(
          "README.md"
          "QUICK_START.md"
          "TESTING_CHECKLIST.md"
          "OMP_SETUP_GUIDE.md"
          "FINAL_HANDOFF.md"
          "AGENTS.md"
        )
        
        for doc in "${REQUIRED_DOCS[@]}"; do
          if [ -f "$doc" ]; then
            echo "✅ $doc exists"
          else
            echo "❌ $doc missing"
            exit 1
          fi
        done

  test-readme:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v3
    
    - name: Verify README has quick start
      run: |
        if grep -q "bash install.sh" README.md; then
          echo "✅ README has quick start command"
        else
          echo "❌ README missing quick start"
          exit 1
        fi
