<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYSTEM ERROR - Critical Failure</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            color: #ff0000;
            font-family: 'Courier New', monospace;
            overflow: hidden;
            cursor: none;
        }

        .fullscreen-lock {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            z-index: 999999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .error-box {
            border: 3px solid #ff0000;
            padding: 40px;
            max-width: 600px;
            background: #1a0000;
            box-shadow: 0 0 50px rgba(255, 0, 0, 0.5);
            animation: glitch 0.3s infinite;
        }

        @keyframes glitch {
            0% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(-2px, -2px); }
            60% { transform: translate(2px, 2px); }
            80% { transform: translate(2px, -2px); }
            100% { transform: translate(0); }
        }

        .skull {
            font-size: 80px;
            text-align: center;
            margin-bottom: 20px;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 50%, 100% { opacity: 1; }
            25%, 75% { opacity: 0.5; }
        }

        h1 {
            text-align: center;
            font-size: 32px;
            margin-bottom: 20px;
            text-shadow: 0 0 10px #ff0000;
        }

        .warning {
            font-size: 18px;
            line-height: 1.8;
            margin-bottom: 30px;
            text-align: center;
        }

        .pin-input {
            width: 100%;
            padding: 15px;
            font-size: 24px;
            text-align: center;
            background: #000;
            color: #ff0000;
            border: 2px solid #ff0000;
            font-family: 'Courier New', monospace;
            letter-spacing: 10px;
            margin-bottom: 20px;
        }

        .pin-input:focus {
            outline: none;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.8);
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            font-size: 20px;
            background: #ff0000;
            color: #000;
            border: none;
            cursor: pointer;
            font-weight: bold;
            font-family: 'Courier New', monospace;
            transition: all 0.3s;
        }

        .submit-btn:hover {
            background: #fff;
            box-shadow: 0 0 30px rgba(255, 0, 0, 1);
        }

        .error-msg {
            color: #ff0000;
            text-align: center;
            margin-top: 15px;
            font-size: 16px;
            min-height: 20px;
            animation: shake 0.5s;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .timer {
            text-align: center;
            font-size: 48px;
            color: #ff0000;
            margin-top: 20px;
            font-weight: bold;
        }

        .popup {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #000;
            border: 3px solid #ff0000;
            padding: 30px;
            z-index: 9999999;
            min-width: 400px;
        }

        .popup.active {
            display: block;
        }

        .attempts {
            text-align: center;
            margin-top: 10px;
            font-size: 14px;
            color: #ff6666;
        }
    </style>
</head>
<body>
    <div class="fullscreen-lock" id="lockScreen">
        <div class="error-box">
            <div class="skull">☠️</div>
            <h1>⚠️ SYSTEM INFECTED ⚠️</h1>
            <div class="warning">
                VIRUS TERDETEKSI!<br>
                Sistem Anda telah dienkripsi!<br>
                Semua file penting telah dikunci!<br><br>
                Masukkan PIN untuk membuka akses:
            </div>
            
            <input type="password" 
                   id="pinInput" 
                   class="pin-input" 
                   maxlength="4" 
                   placeholder="****"
                   autocomplete="off">
            
            <button class="submit-btn" onclick="checkPin()">UNLOCK SYSTEM</button>
            
            <div class="attempts" id="attempts">Percobaan tersisa: 999</div>
            <div class="error-msg" id="errorMsg"></div>
            
            <div class="timer" id="timer">--:--</div>
        </div>
    </div>

    <div class="popup" id="popup">
        <h2 style="color: #ff0000; text-align: center;">⚠️ AKSES DITOLAK ⚠️</h2>
        <p style="color: #ff0000; text-align: center; margin-top: 20px;">
            Anda tidak bisa menutup halaman ini!<br>
            Masukkan PIN yang benar!
        </p>
    </div>

    <script>
        document.addEventListener('contextmenu', e => e.preventDefault());

        document.addEventListener('keydown', function(e) {
            if (e.key === 'F12' || 
                (e.ctrlKey && e.shiftKey && e.key === 'I') ||
                (e.ctrlKey && e.key === 'u')) {
                e.preventDefault();
                showPopup();
            }
        });

        window.addEventListener('beforeunload', function(e) {
            e.preventDefault();
            e.returnValue = 'System masih terkunci! Masukkan PIN!';
            return e.returnValue;
        });

        history.pushState(null, null, location.href);
        window.addEventListener('popstate', function() {
            history.pushState(null, null, location.href);
            showPopup();
        });

        document.addEventListener('keydown', function(e) {
            if ((e.ctrlKey && e.key === 'w') || 
                (e.altKey && e.key === 'F4')) {
                e.preventDefault();
                showPopup();
            }
        });

        document.addEventListener('DOMContentLoaded', function() {
            requestFullscreen();
            startTimer();
            document.getElementById('pinInput').focus();
        });

        function requestFullscreen() {
            const elem = document.documentElement;
            if (elem.requestFullscreen) {
                elem.requestFullscreen().catch(() => {});
            } else if (elem.webkitRequestFullscreen) {
                elem.webkitRequestFullscreen();
            } else if (elem.msRequestFullscreen) {
                elem.msRequestFullscreen();
            }
        }

        document.addEventListener('fullscreenchange', function() {
            if (!document.fullscreenElement) {
                requestFullscreen();
                showPopup();
            }
        });

        let attempts = 999;
        let startTime = Date.now();

        function startTimer() {
            setInterval(function() {
                const elapsed = Math.floor((Date.now() - startTime) / 1000);
                const mins = Math.floor(elapsed / 60);
                const secs = elapsed % 60;
                document.getElementById('timer').textContent = 
                    String(mins).padStart(2, '0') + ':' + String(secs).padStart(2, '0');
            }, 1000);
        }

        function checkPin() {
            const input = document.getElementById('pinInput');
            const pin = input.value;
            const errorMsg = document.getElementById('errorMsg');
            const attemptsDiv = document.getElementById('attempts');

            if (pin === '2010') {
                document.body.style.background = '#00ff00';
                document.getElementById('lockScreen').innerHTML = `
                    <div class="error-box" style="border-color: #00ff00; background: #001a00;">
                        <h1 style="color: #00ff00; text-shadow: 0 0 10px #00ff00;">
                            ✅ SISTEM DIBUKA ✅
                        </h1>
                        <p style="color: #00ff00; text-align: center; font-size: 20px; margin-top: 20px;">
                            Akses berhasil!<br>
                            Anda bebas sekarang!
                        </p>
                    </div>
                `;

                window.onbeforeunload = null;
                document.removeEventListener('contextmenu', e => e.preventDefault());
                
                setTimeout(function() {
                    if (document.exitFullscreen) {
                        document.exitFullscreen();
                    } else if (document.webkitExitFullscreen) {
                        document.webkitExitFullscreen();
                    }
                }, 2000);

            } else {
                attempts--;
                attemptsDiv.textContent = `Percobaan tersisa: ${attempts}`;
                errorMsg.textContent = '❌ PIN SALAH! COBA LAGI!';
                input.value = '';
                input.focus();

                document.querySelector('.error-box').style.animation = 'none';
                setTimeout(() => {
                    document.querySelector('.error-box').style.animation = 'glitch 0.3s infinite';
                }, 10);

                if (attempts % 3 === 0) {
                    showPopup();
                }
            }
        }

        function showPopup() {
            const popup = document.getElementById('popup');
            popup.classList.add('active');
            
            setTimeout(function() {
                popup.classList.remove('active');
            }, 2000);
        }

        document.getElementById('pinInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                checkPin();
            }
        });

        let alertCount = 0;
        window.addEventListener('blur', function() {
            alertCount++;
            if (alertCount < 3) {
                alert('⚠️ JANGAN COBA KELUAR! MASUKKAN PIN!');
            }
            window.focus();
        });

        setInterval(function() {
            window.focus();
            document.getElementById('pinInput').focus();
        }, 1000);
    </script>
</body>
</html>
